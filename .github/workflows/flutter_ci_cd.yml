name: Flutter CI/CD - Build & Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'car_parts_scanner/**'
      - '.github/workflows/flutter_ci_cd.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'car_parts_scanner/**'
      - '.github/workflows/flutter_ci_cd.yml'
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Force build and package release APK'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze & Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car_parts_scanner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

  build-release-apk:
    name: Build Release APK
    needs: analyze-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car_parts_scanner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnidrive-release-apk
          path: car_parts_scanner/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (Tag Triggers)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: car_parts_scanner/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
